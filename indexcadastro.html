<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="./stylecadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>



    </header>
    <main>
        <div id="cadastro">
            <h1>Criar conta</h1>

            <input type="email" id="emailCadastro" placeholder="E-mail">
            <input type="password" id="senhaCadastro" placeholder="Senha">
            <input type="password" id="confirmarSenhaCadastro" placeholder="Confirmar Senha">

            <button id="btnCadastro">Cadastrar</button>

            <p>
                Já tem uma conta?
                <a href="./Login.html" id="btnMostrarLogin" >Fazer login</a>
            </p>
        </div>
    </main>

    <footer>
        <img id="twitter" src="./1.png" alt="Twitter">
        <img id="instagram" src="./2.png" alt="Instagram">
        <img id="youtube" src="./3.png" alt="Youtube">
        <img id="whatsApp" src="./4.png" alt="WhatsApp">

    </footer>


    <script type="module" src="./Main.js"></script>
    <a href="Login.html"></a> <!-- Ir para a segunda pagina -->

</body>

</html>
